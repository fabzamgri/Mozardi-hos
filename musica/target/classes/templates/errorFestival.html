<!DOCTYPE html>
<!--
  @author Carlos Prada Escortell
  Entidad: Festival
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Festival no encontrado</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/festival.css}">
</head>
<body>

<header class="cabecera">
    <div class="contenedor">
        <a th:href="@{/}" class="logo">Música</a>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/festivales}">Festivales</a>
        </nav>
    </div>
</header>

<main class="contenido estrecho">
    <div class="contenedor">

        <div class="tarjeta error-caja">
            <div class="codigo">404</div>
            <h1>Festival no encontrado</h1>
            <p>
                No existe ningún festival con el ID
                <strong th:text="${idBuscado}">?</strong>.
            </p>
            <a th:href="@{/festivales}" class="boton boton-principal">Volver al listado</a>
        </div>

    </div>
</main>

<footer class="pie">Entidad Festival · Carlos Prada Escortell</footer>

</body>
</html>
