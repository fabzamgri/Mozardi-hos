<!DOCTYPE html>
<!--
  @author Carlos Prada Escortell
  Entidad: Festival
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${festival.nombre}">Detalle festival</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/festival.css}">
</head>
<body>

<header class="cabecera">
    <div class="contenedor">
        <a th:href="@{/}" class="logo">Música</a>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/festivales}">Festivales</a>
        </nav>
    </div>
</header>

<main class="contenido estrecho">
    <div class="contenedor">

        <article class="detalle">
            <!-- Foto: si no hay nombre de foto o el archivo no existe, se muestra "Sin imagen" -->
            <img th:if="${!#strings.isEmpty(festival.foto)}"
                 th:src="@{/img/festivales/{foto}(foto=${festival.foto})}"
                 th:alt="${festival.nombre}" class="detalle-foto"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="sin-foto"
                 th:style="${#strings.isEmpty(festival.foto)} ? '' : 'display: none;'">Sin imagen</div>

            <div class="detalle-cuerpo">
                <span class="etiqueta" th:text="${festival.categoria}">Categoría</span>
                <h1 th:text="${festival.nombre}">Nombre</h1>

                <p class="detalle-descripcion" th:text="${festival.descripcion}">Descripción</p>

                <div class="datos">
                    <div class="dato">
                        <span>Ciudad</span>
                        <strong th:text="${festival.ciudad}"></strong>
                    </div>
                    <div class="dato">
                        <span>Asistentes</span>
                        <strong th:text="${#numbers.formatInteger(festival.asistentes, 1, 'POINT')}"></strong>
                    </div>
                    <div class="dato">
                        <span>Precio abono</span>
                        <strong th:text="${#numbers.formatDecimal(festival.precioAbono, 1, 2, 'COMMA')} + ' €'"></strong>
                    </div>
                    <div class="dato">
                        <span>ID</span>
                        <strong th:text="${festival.id}"></strong>
                    </div>
                </div>

                <div class="botonera">
                    <a th:href="@{/festivales}" class="boton boton-secundario">Volver al listado</a>
                    <a th:href="@{/festivales/editar/{id}(id=${festival.id})}" class="boton boton-editar">Editar</a>
                </div>
            </div>
        </article>

    </div>
</main>

<footer class="pie">Entidad Festival · Carlos Prada Escortell</footer>

</body>
</html>
