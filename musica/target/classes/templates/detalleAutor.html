<!DOCTYPE html>
<!--
  @author Lucas Palermo Andreu
  Entidad: Autores Clásicos
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${autor.nombre}">Detalle autor</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/autores.css}">
</head>
<body>

<header class="cabecera">
    <div class="contenedor">
        <a th:href="@{/}" class="logo">Música</a>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/autoresclasicos}">Autores clásicos</a>
        </nav>
    </div>
</header>

<main class="contenido estrecho">
    <div class="contenedor">

        <article class="detalle">
            <!-- Retrato: admite una URL (http...) o un archivo de static/img/autores/.
                 Si no hay imagen o no carga, se muestra la inicial del autor. -->
            <div class="retrato">
                <img th:if="${#strings.startsWith(autor.imagen, 'http')}"
                     th:src="${autor.imagen}"
                     th:alt="${autor.nombre}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <img th:if="${!#strings.isEmpty(autor.imagen) and !#strings.startsWith(autor.imagen, 'http')}"
                     th:src="@{/img/autores/{foto}(foto=${autor.imagen})}"
                     th:alt="${autor.nombre}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="inicial"
                     th:style="${#strings.isEmpty(autor.imagen)} ? '' : 'display: none;'"
                     th:text="${#strings.substring(autor.nombre, 0, 1)}">A</div>
            </div>

            <div class="detalle-cuerpo">
                <span class="siglo" th:text="'Siglo ' + ${autor.siglo}">Siglo</span>
                <h1 th:text="${autor.nombre}">Nombre</h1>
                <p class="fechas" th:text="'Nacido el ' + ${autor.fechaNacimiento}">Fecha</p>

                <div class="datos">
                    <div class="dato">
                        <span>Siglo</span>
                        <strong th:text="${autor.siglo}"></strong>
                    </div>
                    <div class="dato">
                        <span>Fecha de nacimiento</span>
                        <strong th:text="${autor.fechaNacimiento}"></strong>
                    </div>
                    <div class="dato">
                        <span>ID</span>
                        <strong th:text="${autor.id}"></strong>
                    </div>
                </div>

                <h3>Obras destacadas</h3>
                <p class="detalle-descripcion" th:text="${autor.obrasDestacadas}">Obras</p>

                <div class="botonera">
                    <a th:href="@{/autoresclasicos}" class="boton">Volver al listado</a>
                    <a th:href="@{/autoresclasicos/editar/{id}(id=${autor.id})}" class="boton boton-principal">Editar</a>
                </div>
            </div>
        </article>

    </div>
</main>

<footer class="pie">Entidad Autores clásicos · Lucas Palermo Andreu</footer>

</body>
</html>
