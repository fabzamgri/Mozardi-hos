<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autor no encontrado</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/autores.css}">
</head>
<body>

<header class="cabecera">
    <div class="contenedor">
        <a th:href="@{/}" class="logo">Música</a>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/autoresclasicos}">Autores clásicos</a>
        </nav>
    </div>
</header>

<main class="contenido estrecho">
    <div class="contenedor">

        <div class="ficha error-caja">
            <div class="clave">𝄞 404</div>
            <h1>Autor no encontrado</h1>
            <p>
                No existe ningún autor con el ID
                <strong th:text="${idBuscado}">?</strong>.
            </p>
            <a th:href="@{/autoresclasicos}" class="boton boton-principal">Volver al listado</a>
        </div>

    </div>
</main>

<footer class="pie">Entidad Autores clásicos · Lucas Palermo Andreu</footer>

</body>
</html>
