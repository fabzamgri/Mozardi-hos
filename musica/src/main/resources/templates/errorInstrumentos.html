
<!DOCTYPE html>
<!--
@author Lucia Troncho Ortí
Entidad: Instrumento
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Instrumento no encontrado</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background: #171525;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-card {
      background: #252039;
      border: 1px solid #8b5cc7;
      border-radius: 20px;
      padding: 50px;
      text-align: center;
      max-width: 550px;
      margin: 20px;
    }

    .error-number {
      font-size: 90px;
      font-weight: bold;
      color: #d6b5ff;
    }

    .icono-error {
      font-size: 55px;
    }

    .btn-purple {
      background: #8b5cc7;
      color: white;
    }

    .btn-purple:hover {
      background: #7043a8;
      color: white;
    }
  </style>
</head>

<body>

<div class="error-card">

  <div class="icono-error">🎵</div>

  <div class="error-number">404</div>

  <h1>¡Instrumento no encontrado!</h1>

  <p class="text-secondary mt-3">
    Lo sentimos, el instrumento que estás buscando
    no existe o ha sido eliminado de nuestra colección.
  </p>

  <div class="d-flex justify-content-center gap-2 flex-wrap mt-4">

    <a th:href="@{/instrumentos}"
       class="btn btn-purple">
      Volver a instrumentos
    </a>

    <a th:href="@{/}"
       class="btn btn-outline-light">
      Ir al inicio
    </a>

  </div>

</div>

</body>
</html>
