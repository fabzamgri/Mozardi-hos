
<!DOCTYPE html>
<!--
@author Lucia Troncho Ortí
Entidad: Instrumento
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Instrumentos musicales</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background: #171525;
      color: #f5f2ff;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: #252039;
    }

    .container-main {
      background: #252039;
      border-radius: 18px;
      padding: 30px;
      margin-top: 45px;
      margin-bottom: 45px;
    }

    h1 {
      color: #d6b5ff;
    }

    .table {
      color: white;
    }

    .table thead th {
      background: #6c42a5;
      color: white;
      border: none;
    }

    .table td {
      background: transparent;
      color: white;
      vertical-align: middle;
    }

    .foto-instrumento {
      width: 85px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #8b5cc7;
    }

    .btn-purple {
      background: #8b5cc7;
      color: white;
      border: none;
    }

    .btn-purple:hover {
      background: #7043a8;
      color: white;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">
      🎵 Instrumentos
    </a>
  </div>
</nav>

<div class="container container-main">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

    <div>
      <h1>Instrumentos musicales</h1>

      <p class="text-secondary">
        Gestiona nuestra colección de instrumentos.
      </p>
    </div>

    <a th:href="@{/instrumentos/nuevo}"
       class="btn btn-purple">
      + Nuevo instrumento
    </a>

  </div>

  <div class="table-responsive">

    <table class="table table-hover">

      <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Familia</th>
        <th>Año de invención</th>
        <th>Peso (kg)</th>
        <th>Acciones</th>
      </tr>
      </thead>

      <tbody>

      <tr th:each="instrumento : ${instrumentos}">

        <td th:text="${instrumento.id_instrumento}"></td>

        <td th:text="${instrumento.nombre}"></td>

        <td th:text="${instrumento.familia}"></td>

        <td th:text="${instrumento.invencion}"></td>

        <td th:text="${instrumento.peso}"></td>

        <td>

          <div class="d-flex gap-2 flex-wrap">

            <a th:href="@{/instrumentos/{id}(id=${instrumento.id_instrumento})}"
               class="btn btn-sm btn-info">
              Ver
            </a>

            <a th:href="@{/instrumentos/editar/{id}(id=${instrumento.id_instrumento})}"
               class="btn btn-sm btn-warning">
              Editar
            </a>

            <form th:action="@{/instrumentos/eliminar/{id}(id=${instrumento.id_instrumento})}"
                  method="post"
                  onsubmit="return confirm('¿Seguro que quieres eliminar este instrumento?')">

              <button type="submit"
                      class="btn btn-sm btn-danger">
                Borrar
              </button>

            </form>

          </div>

        </td>

      </tr>

      <tr th:if="${#lists.isEmpty(instrumentos)}">

        <td colspan="7"
            class="text-center text-secondary py-4">

          No hay instrumentos registrados.

        </td>

      </tr>

      </tbody>

    </table>

  </div>

  <a th:href="@{/}"
     class="btn btn-outline-light mt-3">
    Volver al inicio
  </a>

</div>

</body>
</html>
