
<!DOCTYPE html>
<!--
@author Lucia Troncho Ortí
Entidad: Instrumento
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Detalle del instrumento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #171525;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card-instrumento {
            background: #252039;
            border: 1px solid #8b5cc7;
            border-radius: 20px;
            padding: 35px;
            max-width: 700px;
            margin: 60px auto;
        }

        h1 {
            color: #d6b5ff;
        }

        .foto-principal {
            width: 100%;
            max-width: 350px;
            height: 260px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #8b5cc7;
        }

        .dato {
            padding: 14px;
            background: #322a49;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .etiqueta {
            color: #c4a1ee;
        }

        .btn-purple {
            background: #8b5cc7;
            color: white;
        }

        .btn-purple:hover {
            background: #7043a8;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card-instrumento">

        <h1 class="text-center mb-4">
            🎸 Detalles del instrumento
        </h1>

        <div class="text-center mb-4">

            <img th:src="@{/img/instrumentos/{foto}(foto=${instrumento.imagen})}"
                 alt="Fotografía del instrumento"
                 class="foto-principal">

        </div>

        <h2 class="text-center mb-4"
            th:text="${instrumento.nombre}">
        </h2>

        <div class="dato">

            <span class="etiqueta">Identificador:</span>

            <strong th:text="${instrumento.id_instrumento}"></strong>

        </div>

        <div class="dato">

            <span class="etiqueta">Nombre:</span>

            <strong th:text="${instrumento.nombre}"></strong>

        </div>

        <div class="dato">

            <span class="etiqueta">Familia musical:</span>

            <strong th:text="${instrumento.familia}"></strong>

        </div>

        <div class="dato">

            <span class="etiqueta">Año de invención:</span>

            <strong th:text="${instrumento.invencion}"></strong>

        </div>

        <div class="dato">

            <span class="etiqueta">Peso:</span>

            <strong th:text="${instrumento.peso + ' kg'}"></strong>

        </div>

        <div class="d-flex gap-2 mt-4 flex-wrap">

            <a th:href="@{/instrumentos/editar/{id}(id=${instrumento.id_instrumento})}"
               class="btn btn-warning">
                Editar
            </a>

            <a th:href="@{/instrumentos}"
               class="btn btn-outline-light">
                Volver al listado
            </a>

        </div>

    </div>

</div>

</body>
</html>
