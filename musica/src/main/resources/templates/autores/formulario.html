<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Autor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
<div class="container my-5" style="max-width: 600px;">
    <h2 class="text-warning mb-4" th:text="${autor.id == 0} ? 'Añadir Nuevo Autor' : 'Editar Autor'">Formulario</h2>

    <!-- IMPORTANTE: enctype="multipart/form-data" permite subir archivos -->
    <form th:action="@{/autores/guardar}" method="post" enctype="multipart/form-data" th:object="${autor}" class="bg-secondary p-4 rounded border border-warning">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre del Autor</label>
            <input type="text" th:field="*{nombre}" class="form-control bg-dark text-light border-secondary" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Siglo</label>
            <input type="text" th:field="*{siglo}" class="form-control bg-dark text-light border-secondary" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Nacimiento</label>
            <input type="text" th:field="*{fechaNacimiento}" class="form-control bg-dark text-light border-secondary" required />
        </div>

        <!-- NUEVO CAMPO DE SUBIDA DE IMAGEN -->
        <div class="mb-3">
            <label class="form-label">Subir Imagen (Opcional)</label>
            <input type="file" name="archivoImagen" accept="image/png, image/jpeg, image/jpg" class="form-control bg-dark text-light border-secondary" />

            <!-- Mostrar foto actual si estamos editando -->
            <div th:if="${autor.imagen != null and autor.imagen != ''}" class="mt-3 text-center">
                <p class="small text-warning mb-1">Imagen actual:</p>
                <img th:src="${autor.imagen}" alt="Actual" style="max-height: 80px;" class="rounded border border-warning">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Obras Destacadas</label>
            <textarea th:field="*{obrasDestacadas}" class="form-control bg-dark text-light border-secondary" rows="3" required></textarea>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="/autores" class="btn btn-outline-light">Cancelar</a>
            <button type="submit" class="btn btn-warning fw-bold">Guardar</button>
        </div>
    </form>
</div>
</body>
</html>
