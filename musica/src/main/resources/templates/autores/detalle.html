<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Autor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
<div class="container my-5" style="max-width: 650px;">
    <div class="card bg-secondary text-white border-warning overflow-hidden">
        <div class="text-center bg-dark p-3">
            <img th:src="${#strings.isEmpty(autor.imagen) ? 'https://via.placeholder.com/300x200?text=Sin+Imagen' : autor.imagen}"
                 alt="Foto de autor"
                 class="img-fluid rounded border border-warning"
                 style="max-height: 250px; object-fit: contain;" />
        </div>
        <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
            <h3 class="mb-0 fw-bold" th:text="${autor.nombre}">Nombre Autor</h3>
            <span class="badge bg-dark" th:text="'ID: ' + ${autor.id}">ID</span>
        </div>
        <div class="card-body">
            <p><strong>Siglo:</strong> <span th:text="${autor.siglo}">18</span></p>
            <p><strong>Fecha de Nacimiento:</strong> <span th:text="${autor.fechaNacimiento}">Fecha</span></p>
            <hr class="border-warning">
            <h5>Obras Destacadas:</h5>
            <p class="text-warning-50" th:text="${autor.obrasDestacadas}">Obras...</p>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <a href="/autores" class="btn btn-outline-light">Volver al Listado</a>
            <a th:href="@{/autores/formulario/{id}(id=${autor.id})}" class="btn btn-warning fw-bold">Editar</a>
        </div>
    </div>
</div>
</body>
</html>
