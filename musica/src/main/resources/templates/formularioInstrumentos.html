
<!DOCTYPE html>
<!--
@author Lucia Troncho Ortí
Entidad: Instrumento
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Formulario de instrumento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #171525;
            color: white;
            font-family: Arial, sans-serif;
        }

        .formulario {
            background: #252039;
            border-radius: 20px;
            padding: 35px;
            max-width: 650px;
            margin: 50px auto;
            border: 1px solid #6c568d;
        }

        h1 {
            color: #d6b5ff;
        }

        label {
            color: #c4a1ee;
            margin-bottom: 7px;
        }

        .form-control {
            background: #322a49;
            border: 1px solid #6c568d;
            color: white;
        }

        .form-control:focus {
            background: #322a49;
            color: white;
            border-color: #b88aef;
            box-shadow: 0 0 5px #b88aef;
        }

        .form-control::placeholder {
            color: #aaa0bd;
        }

        .foto-preview {
            width: 160px;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #8b5cc7;
        }

        .btn-purple {
            background: #8b5cc7;
            color: white;
            border: none;
        }

        .btn-purple:hover {
            background: #7043a8;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="formulario">

        <h1 class="mb-4"
            th:text="${instrumento.id_instrumento == 0 ? 'Añadir instrumento' : 'Editar instrumento'}">
            Instrumento
        </h1>

        <p class="text-secondary">
            Completa los datos del instrumento musical.
        </p>

        <form th:action="@{/instrumentos/guardar}"
              th:object="${instrumento}"
              method="post">

            <input type="hidden" th:field="*{id_instrumento}">

            <!-- NOMBRE -->

            <div class="mb-3">

                <label for="nombre" class="form-label">
                    Nombre del instrumento
                </label>

                <input type="text"
                       id="nombre"
                       th:field="*{nombre}"
                       class="form-control"
                       placeholder="Ej. Guitarra"
                       required>

            </div>

            <!-- FAMILIA -->

            <div class="mb-3">

                <label for="familia" class="form-label">
                    Familia musical
                </label>

                <select id="familia"
                        th:field="*{familia}"
                        class="form-control"
                        required>

                    <option value="">Selecciona una familia</option>
                    <option value="Cuerda">Cuerda</option>
                    <option value="Viento">Viento</option>
                    <option value="Percusion">Percusión</option>
                    <option value="Electronico">Electrónico</option>

                </select>

            </div>

            <!-- INVENCION -->

            <div class="mb-3">

                <label for="invencion" class="form-label">
                    Año de invención
                </label>

                <input type="number"
                       id="invencion"
                       th:field="*{invencion}"
                       class="form-control"
                       min="1"
                       required>

            </div>

            <!-- PESO -->

            <div class="mb-3">

                <label for="peso" class="form-label">
                    Peso (kg)
                </label>

                <input type="number"
                       id="peso"
                       th:field="*{peso}"
                       class="form-control"
                       step="0.01"
                       min="0"
                       required>

            </div>

            <!-- IMAGEN -->

            <div class="mb-4">

                <label for="imagen" class="form-label">
                    📷 Fotografía del instrumento
                </label>

                <input type="text"
                       id="imagen"
                       th:field="*{imagen}"
                       class="form-control"
                       placeholder="Ej. guitarra.jpg"
                       required>

                <small class="text-secondary">
                    Escribe el nombre de la fotografía guardada
                    en static/img/instrumentos/.
                </small>

                <!-- VISTA PREVIA -->

                <div class="mt-3"
                     th:if="${instrumento.imagen != null and !instrumento.imagen.isEmpty()}">

                    <p class="text-secondary">
                        Fotografía actual:
                    </p>

                    <img th:src="@{/img/instrumentos/{foto}(foto=${instrumento.imagen})}"
                         alt="Vista previa"
                         class="foto-preview">

                </div>

            </div>

            <!-- BOTONES -->

            <div class="d-flex gap-2 flex-wrap">

                <button type="submit"
                        class="btn btn-purple">
                    Guardar instrumento
                </button>

                <a th:href="@{/instrumentos}"
                   class="btn btn-outline-light">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
